
name: SupportHub CI

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop

jobs:
  backend-build-test:
    name: Backend Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: supporthub
          POSTGRES_USER: supporthub_user
          POSTGRES_PASSWORD: supporthub_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supporthub_user -d supporthub"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_PASSWORD: supporthub_test_password
      JWT_SECRET: c3VwcG9ydGh1Yi10ZXN0LXNlY3JldC0yMDI2LXN1ZmZpY2llbnQ=
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run backend tests
        working-directory: backend
        run: ./mvnw -B clean verify

  frontend-build-test:
    name: Frontend Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --watch=false
